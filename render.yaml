services:
  - type: web
    name: kaivinai
    env: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install --prefix server && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # fill in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # auto-generate a secure random value
      - key: ADMIN_EMAIL
        value: admin@artisan.local
      - key: ADMIN_PASSWORD
        sync: false          # fill in Render dashboard
